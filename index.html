<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hello World!!! — Simulação Salewin.exe</title>
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background: #0f1724;
      color: #b8e0ff;
      overflow: hidden;
    }
    h1 {
      text-align: center;
      margin: 1rem 0 0.2rem;
      font-size: 3rem;
    }
    h2, p {
      text-align: center;
      margin: 0;
    }
    #console {
      background: #071028;
      border: 1px solid #123;
      padding: 12px;
      height: 70vh;
      width: 90%;
      max-width: 900px;
      margin: 1rem auto;
      overflow-y: auto;
      border-radius: 6px;
      font-size: 13px;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,20,20,0.14), rgba(120,0,0,0.25));
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
    }
    .overlay-content {
      text-align: center;
    }
    .pulse {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,0,0,0.9), rgba(255,0,0,0.2));
      filter: blur(8px);
      margin: 0 auto 12px;
      animation: pulse 1.3s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }
    .status-bar {
      background: #071028;
      padding: 6px 12px;
      border-radius: 4px;
      width: 90%;
      max-width: 900px;
      margin: 0 auto 0.5rem;
      font-weight: bold;
      color: #f5f5f5;
      border: 1px solid #123;
    }
  </style>
</head>
<body>

  <h1>Hello World!!!</h1>
  <p>Simulação segura de Salewin.exe</p>

  <div class="status-bar" id="status">Inicializando...</div>

  <div id="console"></div>

  <div class="overlay">
    <div class="overlay-content">
      <div class="pulse"></div>
      <h2>SYSTEM INFECTED</h2>
      <p>Simulação ativa — tudo seguro!</p>
    </div>
  </div>

  <script>
    const consoleEl = document.getElementById('console');
    const statusEl = document.getElementById('status');

    const templates = [
      "Accessing module '%MODULE%'... %RESULT%",
      "Overwriting virtual file 0x%HEX%... %RESULT%",
      "Encrypting placeholder cookie... %RESULT%",
      "Spawning decoy process PID:%PID%... %RESULT%",
      "Injecting fake DLL into UI stream... %RESULT%",
      "Scanning memory segment %SEG%... %RESULT%",
      "Hijacking session token... %RESULT%",
      "Simulating lateral movement to module '%MODULE%'... %RESULT%"
    ];
    const modules = ["auth","ui","cache","logger","db-proxy","metrics","routes"];
    const results = ["OK","FAIL","TIMEOUT","SIMULATED","IGNORED","DETECTED"];

    function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
    function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
    function timestamp(){ return new Date().toLocaleTimeString(); }

    function generateLog(){
      let t = rand(templates);
      t = t.replace("%SEG%", `0x${randInt(1000,9999).toString(16)}`);
      t = t.replace("%HEX%", `${randInt(100000,999999).toString(16)}`);
      t = t.replace("%PID%", `${randInt(1000,9999)}`);
      t = t.replace("%MODULE%", rand(modules));
      t = t.replace("%RESULT%", rand(results));
      return `${timestamp()} ${t}`;
    }

    function generateStatus(){
      const s = [
        "Scanning system...",
        "Overwriting temp files...",
        "Injecting fake malware...",
        "Hijacking UI streams...",
        "Encrypting placeholder logs...",
        "Loading modules..."
      ];
      return rand(s);
    }

    const logs = [];
    function updateConsole(){
      const count = Math.random() < 0.6 ? 2 : Math.random() < 0.85 ? 3 : 5;
      for(let i=0;i<count;i++) logs.push(generateLog());
      if(logs.length>300) logs.splice(0, logs.length-300); // manter últimos 300 logs
      consoleEl.innerHTML = logs.map(l=>`<div>${l}</div>`).join('');
      consoleEl.scrollTop = consoleEl.scrollHeight;
      statusEl.textContent = `Status: ${generateStatus()}`;
    }

    setInterval(updateConsole, 400);
  </script>

</body>
</html>
